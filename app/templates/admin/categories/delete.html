{% extends "admin/base.html" %}{% block title %}カテゴリ削除{% endblock %}{% block content %}<h1>カテゴリを削除</h1>{% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}<section class="admin-confirm"><p>「{{ category.name }}」を削除します。この操作は取り消せません。</p><dl><dt>関連が外れる名言</dt><dd>{{ quote_count }}件</dd><dt>子カテゴリ</dt><dd>{{ child_count }}件</dd></dl><form action="/admin/categories/{{ category.id }}/delete" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="admin-danger" type="submit">削除する</button><a href="/admin/categories/{{ category.id }}/edit">戻る</a></form></section>{% endblock %}
