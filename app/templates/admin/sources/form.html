{% extends "admin/base.html" %}{% block title %}{{ "出典編集" if source_id else "出典追加" }}{% endblock %}{% block content %}<h1>{{ "出典編集" if source_id else "出典追加" }}</h1>{% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}<form class="admin-form" action="{{ '/admin/sources/' ~ source_id if source_id else '/admin/sources' }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="admin-form-grid"><label>名称<input name="title" value="{{ values.title }}" required></label><label>slug<input name="slug" value="{{ values.slug }}" pattern="[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*" required></label><label>著者<select name="author_id"><option value="">未設定</option>{% for item in authors %}<option value="{{ item.id }}"{% if selected_author_id == item.id %} selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label><label>発表年<input type="number" min="1" name="published_year" value="{{ values.published_year or '' }}"></label></div><fieldset><legend>出典種別</legend><div class="admin-option-grid">{% for item in source_types %}<label class="admin-check"><input type="checkbox" name="type_ids" value="{{ item.id }}"{% if item.id in selected_types %} checked{% endif %}> {{ item.name }}</label>{% endfor %}</div></fieldset><label>説明<textarea name="description" rows="6">{{ values.description or "" }}</textarea></label><div class="admin-form-actions"><button type="submit">保存</button><a href="/admin/sources">キャンセル</a></div></form>{% endblock %}
