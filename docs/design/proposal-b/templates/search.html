{% extends "base.html" %}
{% set nav = 'quotes' %}
{% block title %}「{{ q|default('') }}」の検索結果｜名言集.com{% endblock %}
{% block meta_robots %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<div class="mg-text mg-page-body">
  <form class="mg-search mg-search--hero" action="/search" method="get" role="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input class="mg-search__input mg-search__input--hero" type="search" name="q" value="{{ q|default('') }}"
           placeholder="名言・著者・カテゴリを検索" autofocus autocomplete="off"
           hx-get="/search/partial" hx-trigger="keyup changed delay:500ms, search"
           hx-target="#search-results" aria-label="検索">
  </form>

  {# 結果本体はHTMXで差し替わる領域。初期表示はSSR済み #}
  <div id="search-results">
    {% include "partials/search_results.html" %}
  </div>
</div>
{% endblock %}
