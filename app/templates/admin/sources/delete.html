{% extends "admin/base.html" %}{% block title %}出典削除{% endblock %}{% block content %}<h1>出典を削除</h1><section class="admin-confirm"><p>「{{ source.title }}」を削除します。この操作は取り消せません。</p><dl><dt>出典が外れる名言</dt><dd>{{ quote_count }}件</dd><dt>出典が外れる登場人物</dt><dd>{{ character_count }}件</dd></dl><form action="/admin/sources/{{ source.id }}/delete" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="admin-danger" type="submit">削除する</button><a href="/admin/sources/{{ source.id }}/edit">戻る</a></form></section>{% endblock %}
