{% extends "admin/base.html" %}

{% block title %}{{ "名言編集" if quote_id else "名言追加" }}{% endblock %}

{% block content %}
  <h1>{{ "名言編集" if quote_id else "名言追加" }}</h1>
  {% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}
  <form class="admin-form" action="{{ '/admin/quotes/' ~ quote_id if quote_id else '/admin/quotes' }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>日本語本文
      <textarea name="text" rows="5">{{ values.text or "" }}</textarea>
    </label>
    <label>英語本文
      <textarea name="text_en" rows="4">{{ values.text_en or "" }}</textarea>
    </label>
    <div class="admin-form-grid">
      <label>著者
        <select name="author_id">
          <option value="">未設定</option>
          {% for item in authors %}<option value="{{ item.id }}"{% if selected_author_id == item.id %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
        </select>
      </label>
      <label>出典
        <select name="source_id">
          <option value="">未設定</option>
          {% for item in sources %}<option value="{{ item.id }}"{% if selected_source_id == item.id %} selected{% endif %}>{{ item.title }}</option>{% endfor %}
        </select>
      </label>
      <label>登場人物
        <select name="character_id">
          <option value="">未設定</option>
          {% for item in characters %}<option value="{{ item.id }}"{% if selected_character_id == item.id %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
        </select>
      </label>
      <label>重み（1〜10）<input type="number" name="weight" min="1" max="10" value="{{ values.weight }}" required></label>
      <label>slug<input name="slug" value="{{ values.slug or '' }}" pattern="[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*"></label>
      <label>表示言語
        <select name="display_language_preference">
          <option value="ja"{% if values.display_language_preference == "ja" %} selected{% endif %}>日本語</option>
          <option value="en"{% if values.display_language_preference == "en" %} selected{% endif %}>英語</option>
        </select>
      </label>
      <label>旧票数<input type="number" name="legacy_vote_count" min="0" value="{{ values.legacy_vote_count }}" required></label>
      <label class="admin-check"><input type="checkbox" name="enable" value="1"{% if values.enable %} checked{% endif %}> 公開する</label>
    </div>
    <fieldset>
      <legend>カテゴリ（level 2）</legend>
      <div class="admin-option-grid">
        {% for item in categories %}
          <label class="admin-check"><input type="checkbox" name="category_ids" value="{{ item.id }}"{% if item.id in selected_categories %} checked{% endif %}> {{ item.name }}</label>
        {% endfor %}
      </div>
    </fieldset>
    <label>文脈注記
      <textarea name="context_note" rows="7">{{ values.context_note or "" }}</textarea>
    </label>
    <div class="admin-form-actions">
      <button type="submit">保存</button>
      <a href="/admin/quotes">キャンセル</a>
    </div>
  </form>
{% endblock %}
