name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
