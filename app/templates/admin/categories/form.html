{% extends "admin/base.html" %}

{% block title %}{{ "カテゴリ編集" if category_id else "カテゴリ追加" }}{% endblock %}

{% block content %}
  <h1>{{ "カテゴリ編集" if category_id else "カテゴリ追加" }}</h1>
  {% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}
  <form class="admin-form" action="{{ '/admin/categories/' ~ category_id if category_id else '/admin/categories' }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="admin-form-grid">
      <label>名前<input name="name" value="{{ values.name }}" required></label>
      <label>slug<input name="slug" value="{{ values.slug }}" pattern="[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*" required></label>
      <label>level
        <select name="level">
          <option value="1"{% if values.level|string == "1" %} selected{% endif %}>1（親）</option>
          <option value="2"{% if values.level|string == "2" %} selected{% endif %}>2（子）</option>
        </select>
      </label>
      <label>親カテゴリ
        <select name="parent_id">
          <option value="">なし</option>
          {% for item in parents %}<option value="{{ item.id }}"{% if selected_parent_id == item.id %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
        </select>
      </label>
      <label>表示順<input type="number" min="0" name="sort_order" value="{{ values.sort_order }}" required></label>
      <label>色<input name="color" value="{{ values.color or '' }}"></label>
    </div>
    <label>説明<textarea name="description" rows="6">{{ values.description or "" }}</textarea></label>
    <div class="admin-form-actions">
      <button type="submit">保存</button>
      <a href="/admin/categories">キャンセル</a>
    </div>
  </form>
{% endblock %}
