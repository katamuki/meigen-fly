<!DOCTYPE html>
<html lang="ja" class="og--medium">
<head>
<meta charset="utf-8">
<title>名言集.com OG画像 視覚仕様</title>
<style>
  /* ==========================================================
     名言集.com — 名言個別OG画像（1200×630 固定）
     B案「墨（藍）× 宵」Light のトークンと同じ視覚言語
     本番はADR 018に従ってPillowで描画する。このHTMLは視覚仕様とプレビュー用。
     確認時の差し替え箇所:
       - .og-quote  … 名言本文（鉤括弧はテンプレ側で付与）
       - .og-author … 著者名
       - <html class> … 表示幅に応じ og--short (<=20) /
                              og--medium (>20, <=40) / og--long (>40, <=80)
     80超は「…」を含め表示幅80以内へ省略して og--long で描画する。
     ==========================================================*/
  :root {
    --bg:        #F7F3EA;   /* 和紙 */
    --surface:   #FDFBF6;
    --ink:       #1A1714;   /* 墨 */
    --muted:     #6B6259;
    --subtle:    #9A8F80;
    --accent:    #2C5A8C;   /* 藍 */
    --line:      rgba(26,23,20,.12);
    --font-serif:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP',serif;
    --font-sans: system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  .og {
    width:1200px; height:630px; position:relative; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:var(--font-sans);
    /* セーフマージン：周囲 84px。中身はその内側に配置 */
    padding:84px 96px;
    display:flex; flex-direction:column;
  }
  /* 和紙の面：ごく薄い内枠で書画の台紙感 */
  .og::before {
    content:""; position:absolute; inset:40px;
    border:1px solid var(--line); border-radius:6px;
    background:
      linear-gradient(180deg, rgba(253,251,246,.55), rgba(253,251,246,0) 40%);
    pointer-events:none;
  }
  /* 左肩の藍の細い罫（書画の界線イメージ） */
  .og__hairline {
    position:absolute; left:96px; top:110px; bottom:150px; width:2px;
    background:var(--accent); opacity:.9;
  }

  /* --- 本文（主役） --- */
  .og__body {
    flex:1; display:flex; align-items:center;
    padding-left:34px;   /* 藍罫からの逃げ */
  }
  .og-quote {
    font-family:var(--font-serif); color:var(--ink);
    font-weight:600; letter-spacing:.04em;
    text-indent:-.5em;              /* 開き鉤括弧のぶら下げ */
    text-wrap:pretty;
    max-width:100%;
  }
  .og-quote::before { content:"「"; }
  .og-quote::after  { content:"」"; }

  /* 文字量3段階：短文=特大 / 中文=大 / 長文=中 */
  .og--short  .og-quote { font-size:96px; line-height:1.4; }
  .og--medium .og-quote { font-size:66px; line-height:1.55; }
  .og--long   .og-quote { font-size:46px; line-height:1.72; }
  /* 英文はプロポーショナル。段階は同じクラスで運用（下でラテン最適化） */
  .og-quote:lang(en) { letter-spacing:0; text-indent:0; }
  .og--short  .og-quote:lang(en) { font-size:104px; line-height:1.25; }
  .og--medium .og-quote:lang(en) { font-size:72px;  line-height:1.35; }
  .og--long   .og-quote:lang(en) { font-size:50px;  line-height:1.5; }

  /* --- フッター行：著者名＋ブランド（落款） --- */
  .og__foot {
    display:flex; align-items:flex-end; justify-content:space-between;
    padding-left:34px; gap:32px;
  }
  .og-author {
    font-family:var(--font-serif); color:var(--ink);
    font-size:36px; font-weight:600; letter-spacing:.06em;
  }
  .og-author::before {
    content:"— "; color:var(--subtle); font-family:var(--font-sans); font-weight:400;
  }

  /* ブランド＝落款風。藍の角印＋サイト名 */
  .og__brand { display:flex; align-items:center; gap:18px; flex:none; }
  .og__seal {
    width:64px; height:64px; border-radius:10px;
    background:var(--accent); color:var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-serif); font-size:34px; font-weight:600;
    box-shadow:0 6px 18px -8px rgba(44,90,140,.6);
  }
  .og__brandname {
    font-family:var(--font-serif); font-size:30px; font-weight:600;
    letter-spacing:.06em; color:var(--ink);
  }
  .og__brandname b { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
  <div class="og">
    <div class="og__hairline"></div>

    <div class="og__body">
      <p class="og-quote" lang="ja">明日死ぬかのように生きよ。永遠に生きるかのように学べ。</p>
    </div>

    <div class="og__foot">
      <div class="og-author">マハトマ・ガンジー</div>
      <div class="og__brand">
        <span class="og__seal">名</span>
        <span class="og__brandname">名言集<b>.com</b></span>
      </div>
    </div>
  </div>
</body>
</html>
